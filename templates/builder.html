<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Resume</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Build Your Resume</h1>
    
    <p class="page-subtitle">
        Create a professional resume in minutes
    </p>

    <p>Enter your personal information</p>

   <form method="POST" action="/generate" enctype="multipart/form-data">

    <div class="form-section">
        <label>Profile Picture</label>
        <input type="file" name="profile_picture" accept="image/*">

        <label>Full Name</label>
        <input type="text" name="full_name" placeholder="Enter your full name">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email">

        <label>Phone</label>
      <input type="tel" name="phone" placeholder="Enter your phone number">

        <label>Address</label>
        <input type="text" name="address" placeholder="Enter your address">

        <label>Career Objective</label>
        <textarea name="objective" placeholder="Write your career objective"></textarea>
        </div>

        <h2>Education</h2>
        <div class="form-section">

<label>Degree / Course</label>
<input type="text" name="degree" placeholder="Example: B.Tech Computer Science">

<label>College / University</label>
<input type="text" name="college" placeholder="Enter your college or university">

<label>Graduation Year</label>
<input type="text" name="graduation_year" placeholder="Example: 2027">

<label>CGPA / Percentage</label>
<input type="text" name="cgpa" placeholder="Example: 8.5 CGPA">
</div>

<h2>Skills</h2>
<div class="form-section">
    <label>Technical Skills</label>

<input
    type="text"
    name="skills"
    placeholder="Example: Python, HTML, CSS, JavaScript, SQL"
>
    <h2>Projects</h2>

<label>Project Title</label>

<input type="text" name="project_title" placeholder="Example: Digital Resume Builder">

<label>Project Description</label>

<textarea name="project_description" placeholder="Describe your project"></textarea>


<label>Technologies Used</label>

<input
    type="text"
    name="technologies"
    placeholder="Example: HTML, CSS, JavaScript, Python"
>
</div>
    <h3>Project 2</h3>
    <div class="form-section">

<label>Project Title</label>

<input type="text" name="project_title_2" placeholder="Example: Student Management System">

<label>Project Description</label>

<textarea name="project_description_2" placeholder="Describe your project"></textarea>

<label>Technologies Used</label>

<input type="text" name="technologies_2" placeholder="Example: Python, Flask, MySQL">
</div>

    <h2>Experience / Internship</h2>

    <h3>Experience </h3>
<div class="form-section">
<label>Job Title</label>

<input type="text" name="job_title_2" placeholder="Example: Web Developer Intern">

<label>Company</label>

<input type="text" name="company_2" placeholder="Example: ABC Technologies">

<label>Duration</label>

<input type="text" name="duration_2" placeholder="Example: June 2025 - August 2025">

<label>Experience Description</label>

<textarea name="experience_description_2" placeholder="Describe your work"></textarea>

<label>Job Title / Role</label>

<input
    type="text"
    name="job_title"
    placeholder="Example: Web Development Intern"
>
<label>Company Name</label>

<input
    type="text"
    name="company"
    placeholder="Enter company name"
>

<label>Duration</label>

<input
    type="text"
    name="duration"
    placeholder="Example: June 2026 - August 2026"
>
<label>Description</label>

<textarea
    name="experience_description"
    placeholder="Describe your work or internship experience"
></textarea>
</div>
<h2>Certifications & Achievements</h2>
<div class="form-section">

<label>Certifications</label>
<textarea
    name="certifications"
    placeholder="Example: Python Certificate, Web Development Certificate"
></textarea>
</div>
<div class="form-section">
    <label>Achievements</label>

    <textarea
        name="achievements"
        placeholder="Example: Won first prize in college hackathon"
    >
</textarea>
</div>

<button type="submit" class="submit-btn">
    Generate Resume
</button>
    </form>

</body>
</html>
